<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P1K9SSV632"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-P1K9SSV632');
    </script>
    <link rel="canonical" href="https://wardrafter.com/search.html">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search results for Ward &amp; Rafter, LLP.">
    <title>Search | Ward &amp; Rafter, LLP</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .search-results-hero {
            background: var(--color-primary);
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
        }
        .search-results-hero h1 {
            color: var(--color-white);
            font-family: var(--font-primary);
            font-size: 2rem;
            margin-bottom: 1.25rem;
        }
        .search-results-form {
            display: flex;
            max-width: 560px;
            margin: 0 auto;
        }
        .search-results-form input {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 15px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
            font-family: var(--font-secondary);
            color: var(--color-primary);
        }
        .search-results-form button {
            background: var(--color-accent);
            color: var(--color-primary);
            border: none;
            padding: 0.75rem 1.25rem;
            font-size: 18px;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            font-weight: 700;
            transition: background 0.2s;
        }
        .search-results-form button:hover {
            background: var(--color-accent-hover);
        }
        .search-results-section {
            max-width: 760px;
            margin: 2.5rem auto;
            padding: 0 1.5rem 3rem;
        }
        .search-results-count {
            font-size: 14px;
            color: #888;
            margin-bottom: 1.5rem;
        }
        .search-result-item {
            border-bottom: 1px solid #e8e4de;
            padding: 1.25rem 0;
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item a {
            font-family: var(--font-primary);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--color-primary);
            text-decoration: none;
        }
        .search-result-item a:hover {
            color: var(--color-accent);
        }
        .search-result-url {
            font-size: 12px;
            color: #5a8a5a;
            margin: 0.2rem 0 0.4rem;
        }
        .search-result-desc {
            font-size: 14px;
            color: var(--color-secondary);
            line-height: 1.6;
            margin: 0;
        }
        .search-no-results {
            text-align: center;
            padding: 3rem 0;
            color: var(--color-secondary);
        }
        .search-no-results p {
            margin-bottom: 1rem;
        }
        .search-no-results a {
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="search-results-hero">
        <h1>Search Results</h1>
        <form class="search-results-form" id="searchForm" action="search.html" method="get">
            <input type="text" id="searchInput" name="q" placeholder="Search the site..." autocomplete="off" />
            <button type="submit">&#128269;</button>
        </form>
    </div>

    <section class="search-results-section">
        <p class="search-results-count" id="resultsCount"></p>
        <div id="resultsList"></div>
    </section>
    <div id="footer-placeholder"></div>
    <script>
        function loadInclude(id, file, callback) {
            fetch(file)
                .then(r => r.text())
                .then(html => {
                    document.getElementById(id).outerHTML = html;
                    if (callback) callback();
                });
        }
        loadInclude('navbar-placeholder', 'navbar.html', function() {
            // Mobile hamburger menu
            var toggle = document.querySelector(".mobile-menu-toggle");
            var menu = document.querySelector(".navbar-menu");
            if (toggle && menu) {
                toggle.addEventListener("click", function() { menu.classList.toggle("active"); });
            }
            document.querySelectorAll(".navbar-menu .dropdown > a").forEach(function(link) {
                link.addEventListener("click", function(e) {
                    if (window.innerWidth <= 768) { e.preventDefault(); this.parentElement.classList.toggle("open"); }
                });
            });
            document.querySelectorAll(".navbar-menu a:not(.dropdown > a)").forEach(function(link) {
                link.addEventListener("click", function() { menu.classList.remove("active"); });
            });
            // Navbar search
            var navBtn = document.getElementById("navSearchBtn");
            var navBox = document.getElementById("navSearchBox");
            var navInput = document.getElementById("navSearchInput");
            if (navBtn && navBox && navInput) {
                navBtn.addEventListener("click", function(e) {
                    e.stopPropagation();
                    navBox.classList.toggle("open");
                    if (navBox.classList.contains("open")) navInput.focus();
                });
                navInput.addEventListener("keydown", function(e) {
                    if (e.key === "Enter") {
                        var val = navInput.value.trim();
                        if (val) window.location.href = "search.html?q=" + encodeURIComponent(val);
                    }
                });
                document.addEventListener("click", function(e) {
                    if (!navBtn.contains(e.target) && !navBox.contains(e.target)) {
                        navBox.classList.remove("open");
                    }
                });
            }
            // Navbar scroll effect
            var navbar = document.getElementById('navbar');
            if (navbar) {
                var navbarScroll = function() {
                    if (window.scrollY > 50) { navbar.classList.add('scrolled'); }
                    else { navbar.classList.remove('scrolled'); }
                };
                window.addEventListener('scroll', navbarScroll);
                navbarScroll();
            }
        });
        loadInclude('footer-placeholder', 'footer.html');
    </script>
    <script src="search-index.js"></script>
</body>
</html>
